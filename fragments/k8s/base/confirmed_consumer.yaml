# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
# https://kubernetes.io/docs/concepts/overview/working-with-objects/
# The auditor: drains the confirmed queue and marks each record `audited` once it agrees
# with the on-chain `Registration`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confirmed-consumer
# https://kubernetes.io/docs/reference/kubernetes-api/apps/deployment-v1/#DeploymentSpec
spec:
  replicas: 2
  minReadySeconds: 15
  selector:
    matchLabels:
      app.kubernetes.io/name: confirmed-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: confirmed-consumer
    spec:
      # Matches the registrants consumer; the auditor sends no transaction, so finishes well inside it.
      terminationGracePeriodSeconds: 60
      containers:
        - name: consumer
          image: pjlangley/ff_node
          # Trust an image already on the node, so the `kind load`-ed `ff_node:kind` is never pulled.
          imagePullPolicy: IfNotPresent
          command: ["node", "./fragments/apis/fastify/dist/solana_register_sync/confirmed_consumer.js"]
          envFrom:
            - configMapRef:
                name: solana-register-sync-config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
