name: terraform deploy (ff_prod)

on: workflow_call

jobs:
  changes:
    runs-on: ubuntu-latest
    name: git changes
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        # Deliberately coarse. This filter is a cost optimisation, not a safety gate: the gate is the
        # `apply` job's `run_status == 'planned'`, which HCP only reports when the plan found changes (an
        # empty plan finishes as `planned_and_finished`), plus the `ff_prod` approval environment. So
        # over-triggering costs a no-op HCP run and nothing else, while under-triggering would silently
        # leave prod on stale code.
        #
        # `fragments/**` rather than an enumeration of the Lambda bundle's inputs, because that set is not
        # knowable from the import graph: `solana_program_utils` imports the four program IDLs, and whether
        # they reach the artifact depends on which of them survive esbuild's tree-shaking - which changes
        # as the poller changes. `package.json` counts too; it holds the build script's flags.
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            terraform:
              - 'fragments/**'
              # ff_dev is applied from a laptop and is excluded from the HCP upload anyway
              - '!fragments/terraform/ff_dev/**'
              - 'package.json'
              - 'package-lock.json'
              - '.terraform-version'
              - '.github/workflows/terraform_deploy.yml'

  plan:
    runs-on: ubuntu-latest
    name: terraform plan
    needs: [changes]
    if: needs.changes.outputs.terraform == 'true'
    outputs:
      run_id: ${{ steps.create_run.outputs.run_id }}
      run_status: ${{ steps.create_run.outputs.run_status }}
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_CLOUD_ORGANIZATION: pjlangley
      TF_WORKSPACE: ff_prod
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: install npm dependencies
        run: npm ci

      # The HCP runner has no Node.js toolchain, so the bundle `archive_file` zips has to exist in the
      # configuration before it is uploaded.
      - name: build poller lambda bundle
        run: node --run solana_register_sync:build

      - id: upload
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: fragments/terraform

      - id: create_run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}

      - id: plan_output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.3.2
        with:
          plan: ${{ steps.create_run.outputs.plan_id }}

      - name: hcp run link
        run: echo "Review plan in HCP → ${{ steps.create_run.outputs.run_link }}" >> $GITHUB_STEP_SUMMARY

  apply:
    runs-on: ubuntu-latest
    name: terraform apply
    needs: [plan]
    if: needs.plan.outputs.run_status == 'planned'
    # Manual-approval gate (required reviewer + main-branch restriction) and scoped secrets
    environment: ff_prod
    env:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TF_CLOUD_ORGANIZATION: pjlangley
    steps:
      - uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        with:
          run: ${{ needs.plan.outputs.run_id }}
          comment: "Approved via GH Actions environment ff_prod by ${{ github.actor }}"
